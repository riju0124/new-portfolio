<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (VERY IMPORTANT for ranking) -->
    <title>
      Riju | Full Stack Developer Portfolio
    </title>

    <!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/riju.ico?v=1" />
<link rel="shortcut icon" href="/riju.ico?v=1" />

    <!-- SEO Meta -->
    <meta
      name="description"
      content="I am Riju, a full stack developer building modern web interfaces, RAGE:MP systems, and polished digital products."
    />
    <meta
      name="keywords"
      content="Riju, full stack developer, RAGE:MP developer, portfolio, React developer, backend developer"
    />
    <meta name="author" content="Riju" />

    <!-- Google SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://rijunaskar.in/" />

    <!-- Open Graph (Facebook, Discord, etc.) -->
    <meta property="og:title" content="Riju | Developer Portfolio" />
    <meta
      property="og:description"
      content="Full stack developer focused on modern interfaces, backend systems, and premium digital presentation."
    />
    <meta property="og:image" content="https://rijunaskar.in/riju.ico" />
    <meta property="og:url" content="https://rijunaskar.in/" />
    <meta property="og:type" content="website" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Riju Portfolio" />
    <meta
      name="twitter:description"
      content="Full stack developer and RAGE:MP systems builder"
    />
    <meta name="twitter:image" content="https://rijunaskar.in/riju.ico" />

    <!-- Theme color (mobile browser color) -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Schema (VERY IMPORTANT for Google ranking) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Riju",
        "url": "https://rijunaskar.in/",
        "image": "https://rijunaskar.in/riju.ico",
        "jobTitle": "Full Stack Developer",
        "description": "Full stack developer building modern web experiences and RAGE:MP systems.",
        "sameAs": [
          "https://instagram.com/riju_naskar007",
          "https://discord.com/users/destroyer_will.destroy",
          "https://github.com/riju0124"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

  </body>
</html>
